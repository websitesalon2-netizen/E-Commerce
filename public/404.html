<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Pioneer Clothing House</title>
    <script>
      // Single Page Application fallback for GitHub Pages
      // Redirects to base application path preserving current hash
      var path = window.location.pathname;
      var repo = path.split('/')[1] || '';
      var target = repo ? '/' + repo + '/#' : '/#';
      window.location.replace(target);
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 40px; background: #fafaf9; color: #1c1917;">
    <h2>Loading Pioneer Clothing House...</h2>
    <p><a href="./#/" style="color: #991b1b; text-decoration: underline;">Click here if you are not redirected automatically</a></p>
  </body>
</html>
